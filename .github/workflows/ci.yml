name: model-registry-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build mlflow
      - run: docker compose up -d --wait
      - name: Check MLflow health
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:5000/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

